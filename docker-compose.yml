services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile.production
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TaskManagementDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true;"

      Jwt__SecretKey: "${JWT_SECRET}"
      Cors__AllowedOrigins__0: "https://sprinta.id.vn"
      Cors__AllowedOrigins__1: "https://www.sprinta.id.vn"
      Frontend__BaseUrl: "https://sprinta.id.vn"

      PaymentProviders__SePay__Enabled: "${SEPAY_ENABLED:-false}"
      PaymentProviders__SePay__WebhookSecret: "${SEPAY_WEBHOOK_SECRET:-}"
      PaymentProviders__SePay__BankCode: "${SEPAY_BANK_CODE:-}"
      PaymentProviders__SePay__AccountNumber: "${SEPAY_ACCOUNT_NUMBER:-}"
      PaymentProviders__SePay__AccountName: "${SEPAY_ACCOUNT_NAME:-}"
      # Configure STUN/TURN URLs and the coturn shared secret outside git.
      # The API exchanges only short-lived TURN REST credentials with clients.
      WebRtc__Enabled: "${TURN_ENABLED:-false}"
      WebRtc__IceServers__0__Urls__0: "${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}"
      WebRtc__IceServers__1__Urls__0: "${WEBRTC_TURN_URL:-}"
      WebRtc__IceServers__1__Urls__1: "${WEBRTC_TURN_TCP_URL:-}"
      WebRtc__IceServers__1__SharedSecret: "${WEBRTC_TURN_SHARED_SECRET:-}"
      WebRtc__IceServers__1__CredentialTtlSeconds: "${WEBRTC_TURN_CREDENTIAL_TTL_SECONDS:-3600}"

      IntegrationOAuth__GoogleCalendar__Enabled: "${GOOGLE_CALENDAR_OAUTH_ENABLED:-false}"
      IntegrationOAuth__GoogleCalendar__ClientId: "${GOOGLE_CALENDAR_OAUTH_CLIENT_ID}"
      IntegrationOAuth__GoogleCalendar__ClientSecret: "${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET}"
      IntegrationOAuth__GoogleCalendar__RedirectUri: "${GOOGLE_CALENDAR_OAUTH_REDIRECT_URI}"

      IntegrationOAuth__Gmail__Enabled: "${GMAIL_OAUTH_ENABLED:-false}"
      IntegrationOAuth__Gmail__ClientId: "${GMAIL_OAUTH_CLIENT_ID}"
      IntegrationOAuth__Gmail__ClientSecret: "${GMAIL_OAUTH_CLIENT_SECRET}"
      IntegrationOAuth__Gmail__RedirectUri: "${GMAIL_OAUTH_REDIRECT_URI}"

      IntegrationOAuth__Slack__Enabled: "${SLACK_OAUTH_ENABLED:-false}"
      IntegrationOAuth__Slack__ClientId: "${SLACK_OAUTH_CLIENT_ID}"
      IntegrationOAuth__Slack__ClientSecret: "${SLACK_OAUTH_CLIENT_SECRET}"
      IntegrationOAuth__Slack__RedirectUri: "${SLACK_OAUTH_REDIRECT_URI}"

      Features__AIEnabled: "true"
      CallTranscription__Enabled: "${CALL_TRANSCRIPTION_ENABLED:-false}"
      CallTranscription__Provider: "${CALL_TRANSCRIPTION_PROVIDER:-Deepgram}"
      CallTranscription__Language: "${CALL_TRANSCRIPTION_LANGUAGE:-vi}"
      CallTranscription__SupportedLanguages__0: "vi"
      CallTranscription__SupportedLanguages__1: "en"
      CallTranscription__SampleRate: "${CALL_TRANSCRIPTION_SAMPLE_RATE:-16000}"
      CallTranscription__EndpointingMilliseconds: "${CALL_TRANSCRIPTION_ENDPOINTING_MS:-450}"
      CallTranscription__Model: "${CALL_TRANSCRIPTION_MODEL:-nova-3}"
      CallTranscription__Deepgram__ApiKey: "${DEEPGRAM_API_KEY:-}"
      CallTranscription__Deepgram__Endpoint: "${DEEPGRAM_ENDPOINT:-wss://api.deepgram.com/v1/listen}"
      MeetingAi__Enabled: "${MEETING_AI_ENABLED:-false}"
      MeetingAi__TranscriptChunkSize: "${MEETING_AI_TRANSCRIPT_CHUNK_SIZE:-8}"
      Google__Enabled: "true"
      Google__ClientId: "${GOOGLE_CLIENT_ID}"
      GitHub__ClientId: "${GITHUB_CLIENT_ID}"
      GitHub__ClientSecret: "${GITHUB_CLIENT_SECRET}"
      GitHub__RedirectUri: "https://sprinta.id.vn/auth/github/callback"
      ZenMux__ApiKey: "${ZENMUX_API_KEY}"
      ZenMux__BaseUrl: "${ZENMUX_BASE_URL:-https://zenmux.ai/api/v1}"
      ZenMux__Model: "deepseek/deepseek-v4-flash"
      ZenMux__TranscriptionModel: "${ZENMUX_TRANSCRIPTION_MODEL:-qwen/qwen3-asr-flash}"
      ZenMux__TimeoutSeconds: "60"
      Resend__ApiKey: "${RESEND_API_KEY}"
      Resend__FromEmail: "${RESEND_FROM_EMAIL}"
    depends_on:
      - db
    volumes:
      - api_uploads:/app/uploads
      - data_keys:/app/data-protection-keys
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  turn:
    image: coturn/coturn:4.6.3
    profiles: ["turn"]
    command:
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET}"
      - "--realm=${TURN_REALM}"
      - "--listening-port=${TURN_PORT:-3478}"
      - "--min-port=${TURN_MIN_PORT:-49160}"
      - "--max-port=${TURN_MAX_PORT:-49260}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
      - "--no-multicast-peers"
      - "--log-file=stdout"
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49260}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49260}/udp"
    restart: unless-stopped

volumes:
  mssql_data:
  api_uploads:
  data_keys:
