services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile.production
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TaskManagementDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true;"

      Jwt__SecretKey: "${JWT_SECRET}"
      Cors__AllowedOrigins__0: "${FRONTEND_URL}"
      Cors__AllowedOrigins__1: "https://www.sprinta.id.vn"
      Frontend__BaseUrl: "${FRONTEND_URL}"

      PaymentProviders__SePay__Enabled: "${SEPAY_ENABLED:-false}"
      PaymentProviders__SePay__WebhookSecret: "${SEPAY_WEBHOOK_SECRET:-}"
      PaymentProviders__SePay__BankCode: "${SEPAY_BANK_CODE:-}"
      PaymentProviders__SePay__AccountNumber: "${SEPAY_ACCOUNT_NUMBER:-}"
      PaymentProviders__SePay__AccountName: "${SEPAY_ACCOUNT_NAME:-}"

      IntegrationOAuth__GoogleCalendar__Enabled: "${GOOGLE_CALENDAR_OAUTH_ENABLED:-false}"
      IntegrationOAuth__GoogleCalendar__ClientId: "${GOOGLE_CALENDAR_OAUTH_CLIENT_ID}"
      IntegrationOAuth__GoogleCalendar__ClientSecret: "${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET}"
      IntegrationOAuth__GoogleCalendar__RedirectUri: "${GOOGLE_CALENDAR_OAUTH_REDIRECT_URI}"

      IntegrationOAuth__Gmail__Enabled: "${GMAIL_OAUTH_ENABLED:-false}"
      IntegrationOAuth__Gmail__ClientId: "${GMAIL_OAUTH_CLIENT_ID}"
      IntegrationOAuth__Gmail__ClientSecret: "${GMAIL_OAUTH_CLIENT_SECRET}"
      IntegrationOAuth__Gmail__RedirectUri: "${GMAIL_OAUTH_REDIRECT_URI}"

      IntegrationOAuth__Slack__Enabled: "${SLACK_OAUTH_ENABLED:-false}"
      IntegrationOAuth__Slack__ClientId: "${SLACK_OAUTH_CLIENT_ID}"
      IntegrationOAuth__Slack__ClientSecret: "${SLACK_OAUTH_CLIENT_SECRET}"
      IntegrationOAuth__Slack__RedirectUri: "${SLACK_OAUTH_REDIRECT_URI}"

      Features__AIEnabled: "true"
      Google__Enabled: "true"
      Google__ClientId: "${GOOGLE_CLIENT_ID}"
      GitHub__ClientId: "${GITHUB_CLIENT_ID}"
      GitHub__ClientSecret: "${GITHUB_CLIENT_SECRET}"
      GitHub__RedirectUri: "https://www.sprinta.id.vn/auth/github/callback"
      ZenMux__ApiKey: "${ZENMUX_API_KEY}"
      ZenMux__Model: "deepseek/deepseek-v4-flash"
      ZenMux__TimeoutSeconds: "60"
      Resend__ApiKey: "${RESEND_API_KEY}"
      Resend__FromEmail: "${RESEND_FROM_EMAIL}"
    depends_on:
      - db
    volumes:
      - api_uploads:/app/uploads
      - data_keys:/app/data-protection-keys
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mssql_data:
  api_uploads:
  data_keys:
