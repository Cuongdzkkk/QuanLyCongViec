name: Audit SprintA VPS Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?VPS_SSH_KEY is required}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS is required}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only VPS environment audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"

          ssh \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'bash -s' <<'REMOTE_AUDIT'
          set -u

          printf 'REMOTE_USER=%s\n' "$(whoami)"
          printf 'HOSTNAME=%s\n' "$(hostname)"
          printf 'PWD=%s\n' "$(pwd)"

          printf '%s\n' '--- deploy command metadata ---'
          type -a deploy 2>/dev/null || true
          deploy_path="$(command -v deploy 2>/dev/null || true)"
          if [ -n "$deploy_path" ]; then
            printf 'DEPLOY_COMMAND=%s\n' "$deploy_path"
          else
            printf 'DEPLOY_COMMAND=UNKNOWN\n'
          fi

          sanitize_deploy_lines() {
            sed -E \
              -e 's/((API_KEY|PASSWORD|SECRET|TOKEN|VPS_SSH_KEY)[[:space:]]*=[[:space:]]*).*/\1<REDACTED>/Ig' \
              -e 's/(Authorization:[[:space:]]*Bearer[[:space:]]+).*/\1<REDACTED>/Ig'
          }

          if [ -n "$deploy_path" ] && [ -f "$deploy_path" ] && [ -r "$deploy_path" ]; then
            printf '%s\n' '--- deploy implementation references ---'
            grep -nE 'cd |WORKDIR|DEPLOY_DIR|docker compose|docker-compose|--env-file|\.env|source |export |systemctl|EnvironmentFile|git clean|git reset|git checkout' "$deploy_path" 2>/dev/null \
              | sanitize_deploy_lines || true
          fi

          printf '%s\n' '--- compose candidates ---'
          compose_candidates="$(find /opt /srv /var/www /home -maxdepth 5 -type f \( -name docker-compose.yml -o -name docker-compose.yaml -o -name compose.yml -o -name compose.yaml \) -print 2>/dev/null | sort -u || true)"
          if [ -n "$compose_candidates" ]; then
            printf '%s\n' "$compose_candidates"
            compose_file="$(printf '%s\n' "$compose_candidates" | head -n 1)"
            compose_dir="$(dirname "$compose_file")"
            printf 'COMPOSE_DIR=%s\n' "$compose_dir"
          else
            compose_file=""
            compose_dir=""
            printf 'COMPOSE_DIR=UNKNOWN\n'
          fi

          env_status() {
            key="$1"
            file="$2"
            file_set=false
            shell_set=false
            if [ -n "$file" ] && [ -f "$file" ] && grep -qE "^[[:space:]]*${key}[[:space:]]*=[[:space:]]*[^#[:space:]]" "$file"; then
              file_set=true
            fi
            eval "value=\${${key}:-}"
            if [ -n "$value" ]; then
              shell_set=true
            fi
            if [ "$file_set" = true ] || [ "$shell_set" = true ]; then
              printf '%s=SET\n' "$key"
            else
              printf '%s=MISSING\n' "$key"
            fi
            unset value
          }

          printf '%s\n' '--- environment source ---'
          env_file_path=""
          source_kind="unknown"
          if [ -n "$compose_dir" ]; then
            if [ -f "$compose_dir/.env" ]; then
              env_file_path="$compose_dir/.env"
              source_kind='.env'
              printf 'ENV_FILE=%s\n' "$env_file_path"
              stat -c 'ENV_FILE_MODE=%a' "$env_file_path" 2>/dev/null || true
            fi

            if [ -f "$compose_file" ]; then
              printf '%s\n' '--- compose env directives ---'
              grep -nE 'env_file|--env-file|EnvironmentFile|\$\{(RESEND_API_KEY|RESEND_FROM_EMAIL|FRONTEND_URL)\}' "$compose_file" 2>/dev/null \
                | sanitize_deploy_lines || true
            fi
          fi

          if [ -z "$env_file_path" ]; then
            if [ -n "${RESEND_API_KEY:-}${RESEND_FROM_EMAIL:-}${FRONTEND_URL:-}" ]; then
              source_kind='shell'
            fi
          fi

          printf '%s\n' '--- systemd environment references ---'
          grep -RInE 'EnvironmentFile|docker compose|docker-compose' /etc/systemd/system /etc/systemd/user /lib/systemd/system 2>/dev/null \
            | sanitize_deploy_lines || true

          env_persistent='UNKNOWN'
          printf '%s\n' '--- persistence references ---'
          if [ -n "$deploy_path" ] && [ -f "$deploy_path" ] && [ -r "$deploy_path" ]; then
            grep -nE 'git clean|git reset|git checkout|rm -rf|release|recreate|docker compose|docker-compose|--env-file|\.env' "$deploy_path" 2>/dev/null \
              | sanitize_deploy_lines || true
          fi
          if [ -n "$compose_dir" ]; then
            if [ -f "$compose_dir/.env" ]; then
              printf 'ENV_PERSISTENCE_LOCATION=COMPOSE_DIR\n'
            else
              printf 'ENV_PERSISTENCE_LOCATION=UNKNOWN\n'
            fi
            git_root="$(git -C "$compose_dir" rev-parse --show-toplevel 2>/dev/null || true)"
            if [ -n "$git_root" ]; then
              printf 'GIT_ROOT=%s\n' "$git_root"
              case "$compose_dir/.env" in
                "$git_root"/*) printf 'ENV_IN_GIT_TREE=YES\n' ;;
                *) printf 'ENV_IN_GIT_TREE=NO\n' ;;
              esac
            else
              printf 'GIT_ROOT=UNKNOWN\n'
              printf 'ENV_IN_GIT_TREE=UNKNOWN\n'
            fi
          fi

          if [ -n "$env_file_path" ] && [ -n "$deploy_path" ] && [ -f "$deploy_path" ] && [ -r "$deploy_path" ]; then
            if grep -qE 'git clean[^\n]*(-x|-d.*x)|rm -rf[^\n]*(release|compose|deploy)|recreate[^\n]*(release|compose|deploy)' "$deploy_path" 2>/dev/null; then
              env_persistent='NO'
            elif ! grep -qE 'git clean|rm -rf[^\n]*(release|compose|deploy)|recreate[^\n]*(release|compose|deploy)' "$deploy_path" 2>/dev/null; then
              env_persistent='YES'
            fi
          fi

          printf '%s\n' '--- docker status ---'
          if command -v docker >/dev/null 2>&1; then
            docker ps --format 'CONTAINER={{.Names}} IMAGE={{.Image}} STATUS={{.Status}}' 2>/dev/null || true
            if [ -n "$compose_dir" ] && [ -f "$compose_file" ]; then
              (cd "$compose_dir" && docker compose ps 2>/dev/null) || true
            fi
          else
            printf '%s\n' 'DOCKER=UNAVAILABLE'
          fi

          printf '%s\n' '--- final audit summary ---'
          printf 'ENV_SOURCE=%s\n' "$source_kind"
          env_status RESEND_API_KEY "$env_file_path"
          env_status RESEND_FROM_EMAIL "$env_file_path"
          env_status FRONTEND_URL "$env_file_path"
          printf 'ENV_PERSISTENT=%s\n' "$env_persistent"
          REMOTE_AUDIT

      - name: Verify audit workflow scope
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/vps-env-audit.yml
          grep -qE '^  workflow_dispatch:$' .github/workflows/vps-env-audit.yml
          ! grep -qE '^  (push|workflow_run):' .github/workflows/vps-env-audit.yml
